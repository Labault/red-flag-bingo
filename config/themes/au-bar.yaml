theme:
  name: "Au bar"
  slug: "au-bar"
  description: "Du comptoir à la dernière commande : les grandes manières et les petits culots de la soirée."
  emoji: "🍻"

red_flags:

  # Commande (common)
  - text: "Appelle le serveur, puis commence seulement à lire la carte"
    rarity: common
  - text: "Commande pour toute la table sans consulter personne"
    rarity: common
  - text: "Change de cocktail quand le barman a déjà commencé à le préparer"
    rarity: common
  - text: "Dit « surprenez-moi », puis refuse les trois propositions"
    rarity: common
  - text: "Demande un cocktail sans chacun de ses ingrédients"
    rarity: common
  - text: "Dit « la même chose » en montrant trois verres différents"
    rarity: common
  - text: "Commande le plus cher dès qu’on annonce une tournée offerte"
    rarity: common
  - text: "Refuse de préciser la taille de sa bière, puis conteste celle reçue"
    rarity: common
  - text: "Coupe ta commande pour ajouter « juste une petite question »"
    rarity: common
  - text: "Commande en plusieurs fois pour faire revenir le serveur"
    rarity: common
  - text: "Invente un nom de cocktail et reproche au barman de ne pas le connaître"
    rarity: common
  - text: "Réclame un verre gratuit parce que la mousse est retombée"
    rarity: common
  - text: "Demande la recette complète alors que dix personnes attendent"
    rarity: common
  - text: "Renvoie un cocktail presque terminé parce qu’il « n’était pas terrible »"
    rarity: common
  - text: "Affirme avoir demandé sans glace après avoir laissé fondre tous les glaçons"
    rarity: common
  - text: "Commande au comptoir puis recommence auprès du serveur en terrasse"
    rarity: common
  - text: "Prend le verre prêt pour quelqu’un d’autre sans vérifier"
    rarity: common
  - text: "Réclame un ingrédient absent de la carte après deux refus"
    rarity: common
  - text: "Dicte les dosages au barman sans lui laisser finir sa phrase"
    rarity: common
  - text: "Donne sa commande à un client qui ramène simplement ses verres"
    rarity: common

  # Service (common)
  - text: "Claque des doigts pour appeler le serveur"
    rarity: common
  - text: "Siffle le personnel depuis l’autre bout de la terrasse"
    rarity: common
  - text: "Tape sa monnaie sur le comptoir pour accélérer le service"
    rarity: common
  - text: "Attrape le bras du serveur qui passe avec un plateau"
    rarity: common
  - text: "Dit « enfin » avant que le serveur ait posé les verres"
    rarity: common
  - text: "Crie le prénom du barman pour montrer qu’il le connaît"
    rarity: common
  - text: "Bloque le serveur pour finir une anecdote pendant le rush"
    rarity: common
  - text: "Réclame un sourire à la personne qui vient prendre sa commande"
    rarity: common
  - text: "Explique au personnel que son métier « n’est quand même pas compliqué »"
    rarity: common
  - text: "Tutoie le serveur, puis exige qu’on le vouvoie"
    rarity: common
  - text: "Répond à une question du serveur sans lever les yeux de son téléphone"
    rarity: common
  - text: "Accuse le serveur d’avoir oublié une commande que personne n’a passée"
    rarity: common
  - text: "Fait signe à deux serveurs pour la même demande sans les prévenir"
    rarity: common
  - text: "Réclame le responsable avant d’expliquer le problème"
    rarity: common
  - text: "Raconte au serveur la blague qu’il vient de faire sur son métier"
    rarity: common
  - text: "Dit « ça va, on plaisante » après une remarque au personnel"
    rarity: common
  - text: "Garde la carte pour continuer à la lire quand le serveur la réclame"
    rarity: common
  - text: "Pose son verre dans la main déjà chargée du serveur"
    rarity: common
  - text: "Demande un service au serveur qui part avec son manteau"
    rarity: common
  - text: "Fait semblant de ne pas entendre quand on lui demande de dégager le passage"
    rarity: common

  # Addition (common)
  - text: "Disparaît aux toilettes au moment où l’addition arrive"
    rarity: common
  - text: "Propose de diviser la note après avoir commandé deux fois plus que les autres"
    rarity: common
  - text: "Compte le pourboire des autres dans sa propre part"
    rarity: common
  - text: "Annonce « je vous fais un virement » sans demander de coordonnées"
    rarity: common
  - text: "Arrondit systématiquement sa part vers le bas"
    rarity: common
  - text: "Prend la monnaie commune pour rembourser « ses deux euros de l’autre fois »"
    rarity: common
  - text: "Conteste le prix imprimé sur la carte qu’il a sous les yeux"
    rarity: common
  - text: "Demande une réduction parce qu’il « connaît du monde ici »"
    rarity: common
  - text: "Pose vingt centimes en disant au serveur « ça, c’est pour toi »"
    rarity: common
  - text: "Recompte la note à voix haute mais oublie chaque fois son dernier verre"
    rarity: common
  - text: "Prétend que le cocktail de sa photo n’était pas à lui"
    rarity: common
  - text: "Demande au serveur de retrouver qui a bu chaque verre"
    rarity: common
  - text: "Veut payer séparément après avoir demandé une facture unique"
    rarity: common
  - text: "Refuse de payer un verre parce qu’il en a laissé une gorgée"
    rarity: common
  - text: "Fait sortir tout le groupe avant de chercher sa carte"
    rarity: common
  - text: "Compare le prix du verre à celui de la bouteille au supermarché"
    rarity: common
  - text: "Réclame le remboursement du citron qu’il n’a pas mangé"
    rarity: common
  - text: "Annonce « c’est réglé » alors qu’il n’a payé que son verre"
    rarity: common
  - text: "Laisse les autres couvrir le pourboire qu’il avait promis"
    rarity: common
  - text: "Tend une réduction expirée et accuse le serveur de manquer de souplesse"
    rarity: common

  # Tournées (common)
  - text: "Attend que quelqu’un se lève avant d’annoncer qu’il reprendrait bien un verre"
    rarity: common
  - text: "Réapparaît à table pile quand les boissons de la tournée arrivent"
    rarity: common
  - text: "Dit « c’est ma tournée » puis demande à quelqu’un d’avancer"
    rarity: common
  - text: "Compte sa tournée de cafés comme trois tournées de cocktails"
    rarity: common
  - text: "Change de boisson pour une moins chère quand vient son tour de payer"
    rarity: common
  - text: "Annonce sa tournée assez bas pour que personne ne l’entende"
    rarity: common
  - text: "Oublie toujours la commande de la même personne"
    rarity: common
  - text: "Commande de l’alcool à quelqu’un qui vient de demander un soda"
    rarity: common
  - text: "Insiste sur « même pas une petite bière ? » après un refus"
    rarity: common
  - text: "Décide que les verres sans alcool ne comptent pas dans sa tournée"
    rarity: common
  - text: "Commande une tournée supplémentaire alors que le groupe a refusé"
    rarity: common
  - text: "Utilise le verre offert pour réclamer un numéro de téléphone"
    rarity: common
  - text: "Rappelle le prix du verre offert à chaque nouvelle conversation"
    rarity: common
  - text: "Choisit qui a droit à sa tournée en fonction des places à table"
    rarity: common
  - text: "Tend sa carte au barman seulement après qu’une autre a été débitée"
    rarity: common
  - text: "Dit « on alterne » après avoir déjà laissé payer trois tournées"
    rarity: common
  - text: "Sert tout le monde sauf la personne qui a payé la bouteille"
    rarity: common
  - text: "S’approprie le verre supplémentaire en disant « personne n’en voulait »"
    rarity: common
  - text: "Accepte deux offres de verre sans prévenir les personnes qui paient"
    rarity: common
  - text: "Fait trinquer le groupe une quatrième fois parce que sa vidéo n’a pas démarré"
    rarity: common

  # Places (common)
  - text: "Réserve trois tabourets avec sa veste alors que ses amis sont déjà assis"
    rarity: common
  - text: "Pose son sac sur la dernière chaise libre et refuse de l’enlever"
    rarity: common
  - text: "S’installe à une table dont les occupants sont au comptoir"
    rarity: common
  - text: "Déplace les affaires des voisins pour agrandir sa place"
    rarity: common
  - text: "Prend une chaise occupée dès que son propriétaire se lève"
    rarity: common
  - text: "Recule son tabouret dans le passage et reproche aux gens de le toucher"
    rarity: common
  - text: "Se plante devant le comptoir après avoir reçu toute sa commande"
    rarity: common
  - text: "Étale son ordinateur sur une table déjà partagée avec quatre personnes"
    rarity: common
  - text: "Met ses pieds sur la chaise où quelqu’un essaie de s’asseoir"
    rarity: common
  - text: "Rapproche sa table des voisins pour écouter leur conversation"
    rarity: common
  - text: "Tourne le dos au groupe pour parler à la table d’à côté"
    rarity: common
  - text: "Bloque l’accès au porte-manteau avec ses affaires"
    rarity: common
  - text: "Accroche sa veste sur le dossier d’un inconnu sans demander"
    rarity: common
  - text: "Monopolise la prise en débranchant le téléphone déjà en charge"
    rarity: common
  - text: "Fait déplacer tout le groupe puis regrette la première table"
    rarity: common
  - text: "S’accoude dans ton assiette en te racontant son histoire"
    rarity: common
  - text: "S’assoit sur la banquette en laissant son sac entre deux groupes debout"
    rarity: common
  - text: "Prend le dessous de verre de son voisin au lieu d’en demander un"
    rarity: common
  - text: "Déplace une table dressée avant de demander si elle est réservée"
    rarity: common
  - text: "Garde une table pour dix alors que le groupe est parti à deux"
    rarity: common

