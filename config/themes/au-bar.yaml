  - text: "Allume sa cigarette avant la réponse à « ça vous dérange ? »"
    rarity: common
  - text: "Éteint sa cigarette dans le verre de quelqu’un d’autre"
    rarity: common
  - text: "Pose son cendrier sous le nez des voisins"
    rarity: common
  - text: "Souffle sa fumée vers la table qui vient de lui demander d’arrêter"
    rarity: common
  - text: "Repart avec le briquet qu’on lui a prêté"
    rarity: common
  - text: "Vide son cendrier par terre quand le serveur tourne le dos"
    rarity: common
  - text: "Vapote à l’intérieur juste sous le panneau d’interdiction"
    rarity: common
  - text: "Ouvre le parasol des voisins pour mettre sa propre table à l’ombre"
    rarity: common
  - text: "Pousse le pied du parasol dans le passage pour gagner dix centimètres"
    rarity: common
  - text: "Prend le plaid posé sur le dossier de la chaise voisine"
    rarity: common
  - text: "Bloque la porte avec sa chaise pour continuer à discuter dehors"
