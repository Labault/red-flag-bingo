  - text: "Décortique les cacahuètes et laisse les coques dans le bol commun"
    rarity: common
  - text: "Gratte le fromage de tous les toasts pour ne manger que le pain"
    rarity: common
  - text: "Demande un supplément gratuit parce que la planche est déjà finie"
