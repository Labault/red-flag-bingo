  - text: "Laisse sa laisse barrer tout le passage entre les tables"
    rarity: common
  - text: "Secoue son parapluie au-dessus des verres des voisins"
    rarity: common
  - text: "Se plaint du soleil après avoir exigé la seule table en plein soleil"
