  - text: "Déplace le chauffage de terrasse sans demander au personnel"
    rarity: common
  - text: "Parle au téléphone debout entre deux tables occupées"
    rarity: common
  - text: "Commente à voix haute ce que mangent les passants"
    rarity: common
  - text: "Laisse ses serviettes s’envoler en disant « le serveur les ramassera »"
