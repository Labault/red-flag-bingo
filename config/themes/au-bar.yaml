  - text: "Utilise ses doigts pour remettre une olive dans le bol commun"
    rarity: common
  - text: "Choisit les morceaux de fromage en touchant tous les autres"
    rarity: common
  - text: "Repose un morceau déjà mordu sur la planche à partager"
    rarity: common
  - text: "Commande une planche pour la table puis garde le pain devant lui"
    rarity: common
  - text: "Dit « je n’ai pas faim » et mange la moitié de ta portion"
