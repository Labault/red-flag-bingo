    rarity: common
  - text: "Pousse quelqu’un pour mieux voir les mariés"
    rarity: common
  - text: "Explique à voix haute ce que le couple aurait dû écrire dans ses vœux"
    rarity: common
  - text: "Bavarde pendant la minute où les mariés remercient leurs proches"
    rarity: common
  - text: "Ouvre bruyamment un paquet pendant le passage le plus silencieux"
    rarity: common
  - text: "Se lève devant tout le premier rang pour filmer l’échange des alliances"
    rarity: common
  - text: "Demande aux mariés de regarder son téléphone pendant qu’ils signent"
    rarity: common
  - text: "Corrige la prononciation de l’officiant depuis sa chaise"
    rarity: common
  - text: "L’officiant se trompe de prénom et recommence avec un autre prénom faux"
    rarity: common
  - text: "Fait sonner sa messagerie une seconde fois après avoir refusé l’appel"
    rarity: common
  - text: "Part chercher un meilleur siège pendant la lecture d’un proche"
