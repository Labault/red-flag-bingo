  - text: "Annonce une surprise sur le groupe avant qu’elle ait eu lieu"
    rarity: common
  - text: "Photographie le montant visible sur une enveloppe cadeau"
    rarity: common
  - text: "Garde la lampe de son téléphone allumée dans les yeux du couple au bal"
