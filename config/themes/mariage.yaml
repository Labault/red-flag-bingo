  - text: "Demande aux mariés où se garer pendant qu’ils entrent dans la mairie"
    rarity: common
  - text: "Se gare devant l’accès du traiteur pour être au plus près"
    rarity: common
  - text: "Arrive avec une personne supplémentaire et réclame un couvert"
    rarity: common
  - text: "Dit « on pensait que c’était indicatif » en montrant l’heure de la cérémonie"
    rarity: common
  - text: "Réserve toute une rangée avec sa veste pour des invités encore absents"
    rarity: common
  - text: "S’assoit à une place marquée « parents » et refuse de bouger"
    rarity: common
  - text: "Se plaint du trajet aux mariés avant de leur dire bonjour"
    rarity: common
  - text: "Compare l’entrée du domaine à celle d’un mariage « beaucoup plus chic »"
    rarity: common
  - text: "Demande son numéro de table avant même de saluer le couple"
    rarity: common
  - text: "Critique le lieu en disant « au moins, vous avez dû économiser »"
    rarity: common
  - text: "Annonce qu’il ne restera que si le repas est bon"
    rarity: common
  - text: "Fait une entrée bruyante au milieu de la lecture des vœux"
    rarity: common
  - text: "Annonce aux témoins les erreurs qu’ils auraient évitées en le consultant"
