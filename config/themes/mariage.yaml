  - text: "Se filme en train de verser sa contribution dans l’urne"
    rarity: common
  - text: "Envoie un vocal en demandant au discours de s’arrêter une seconde"
    rarity: common
  - text: "Commente les photos publiées au lieu d’écouter les remerciements"
