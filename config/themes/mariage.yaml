  - text: "Regarde son propre téléphone pendant que tout le groupe attend le déclenchement"
    rarity: common
  - text: "Annonce « encore une » après que le photographe a libéré le groupe"
    rarity: common
  - text: "Veut vérifier chaque photo sur l’appareil du photographe"
