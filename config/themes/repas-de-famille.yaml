# 500 situations autonomes : 300 common, 140 rare, 60 legendary.
theme:
  name: "Repas de famille"
  slug: "repas-de-famille"
  description: "De l’apéro qui s’éternise aux adieux sur le pas de la porte. La famille fournit les cases."
  emoji: "🍽️"

