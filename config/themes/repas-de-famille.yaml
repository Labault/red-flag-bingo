  - text: "Se plaint d’avoir raté l’apéro après être arrivé une heure en retard"
    rarity: common
  - text: "Déplace les marques-places pour retrouver « sa » chaise"
    rarity: common
  - text: "Garde son manteau sur la dernière chaise libre"
    rarity: common
  - text: "Entre en annonçant qu’il ne pourra pas rester, puis refuse de partir"
    rarity: common
  - text: "Compare la déco aux photos de sa dernière visite pour prouver que c’était mieux avant"
    rarity: common
  - text: "Inspecte la table avant même de saluer les hôtes"
    rarity: common
  - text: "Demande pourquoi une personne absente n’a pas été invitée"
