theme:
  name: "Réunion de travail"
  slug: "reunion-de-travail"
  description: "Un ordre du jour absent, trois priorités absolues et une décision remise à jeudi. La réunion peut commencer."
  emoji: "📅"

red_flags:
  # Communs : 300 scènes du quotidien.

  # Invitation et démarrage
  - text: "L’invitation s’appelle juste « Point »"
    rarity: common
  - text: "L’ordre du jour est « discuter du sujet »"
    rarity: common
  - text: "La réunion commence par « c’est quoi le sujet déjà ? »"
    rarity: common
  - text: "L’organisateur arrive en dernier"
    rarity: common
  - text: "On attend quelqu’un qui a décliné l’invitation"
    rarity: common
  - text: "La personne attendue n’a pas été invitée"
    rarity: common
  - text: "L’invitation renvoie à un document sans donner le lien"
    rarity: common
  - text: "L’invitation contient plus de personnes en copie que de mots de contexte"
    rarity: common
  - text: "La réunion est obligatoire pour les invités marqués facultatifs"
    rarity: common
  - text: "Le retardataire demande de tout reprendre depuis le début"
    rarity: common
  - text: "Le briefing préalable est envoyé pendant l’introduction"
    rarity: common
  - text: "Deux invitations portent le même titre et des liens différents"
    rarity: common
  - text: "On découvre que la réunion a changé d’heure en y entrant"
    rarity: common
  - text: "L’animateur demande qui veut animer"
    rarity: common
  - text: "Quelqu’un commence par lire à voix haute l’invitation reçue par tous"
    rarity: common

  # Agenda et temps
  - text: "La réunion urgente commence par quinze minutes sur le week-end"
    rarity: common
  - text: "L’introduction consomme la moitié du créneau"
    rarity: common
  - text: "« Une dernière chose » ouvre un nouveau sujet"
    rarity: common
  - text: "Le point le plus important arrive quand tout le monde doit partir"
    rarity: common
  - text: "« Je vais faire court » précède un historique depuis la création du projet"
    rarity: common
  - text: "On annonce cinq minutes de rab pour la troisième fois"
    rarity: common
  - text: "Quelqu’un lance « tant qu’on est tous là » à l’heure de fin"
    rarity: common
  - text: "La pause prévue disparaît parce que l’introduction a débordé"
    rarity: common
  - text: "Le minuteur sonne et son propriétaire l’ignore"
    rarity: common
  - text: "On arrive au sujet quatre et quelqu’un relance le sujet un"
    rarity: common
  - text: "On célèbre le temps gagné en ajoutant un tour de table"
    rarity: common
  - text: "La question « à quelle heure finit-on ? » reste sans réponse"
    rarity: common
  - text: "L’animateur accélère uniquement quand les autres parlent"
    rarity: common
  - text: "Les questions sont reportées à une fin qui n’arrive jamais"
    rarity: common
  - text: "La réunion déborde sur celle où les mêmes personnes sont attendues"
    rarity: common

  # Micro et connexion
  - text: "Quelqu’un confirme « je suis en muet » avec son micro ouvert"
    rarity: common
  - text: "La même personne est connectée avec deux micros qui font écho"
    rarity: common
  - text: "Tout le monde dit « tu es en muet » en même temps"
    rarity: common
  - text: "Le clavier couvre la voix de la personne qui présente"
    rarity: common
  - text: "Le micro reste ouvert pendant une conversation avec quelqu’un hors réunion"
    rarity: common
  - text: "Quelqu’un souffle dans le micro pour vérifier qu’il fonctionne"
    rarity: common
  - text: "On entend chaque bouchée mais pas la réponse à la question"
    rarity: common
  - text: "La sonnerie du téléphone revient sans que personne la coupe"
    rarity: common
  - text: "Quelqu’un explique son problème de son à ceux qu’il n’entend pas"
    rarity: common
  - text: "On poursuit le débat pendant que la personne concernée se reconnecte"
    rarity: common
  - text: "Le casque est branché, mais le son sort toujours des enceintes"
    rarity: common
  - text: "On demande de répéter puis on parle pendant la répétition"
    rarity: common
  - text: "La musique d’attente d’un participant remplace le présentateur"
    rarity: common
  - text: "Le conseil « coupe ta caméra » arrive à quelqu’un qui l’a déjà coupée"
    rarity: common
  - text: "Quelqu’un quitte et revient sans cesse, avec la sonnerie à chaque fois"
    rarity: common

  # Partage d’écran
  - text: "Le présentateur commente un écran qu’il n’a pas partagé"
    rarity: common
  - text: "Le partage montre la visio en miroir à l’infini"
    rarity: common
  - text: "Un message privé sur le client apparaît pendant qu’on lui présente le projet"
    rarity: common
  - text: "Le présentateur cherche son fichier devant tout le monde"
    rarity: common
  - text: "La notification « tu peux me répondre ? » recouvre le graphique"
    rarity: common
  - text: "Le curseur tourne autour de la donnée sans jamais s’arrêter dessus"
    rarity: common
  - text: "Le présentateur dit « ici » en montrant son écran avec le doigt"
    rarity: common
  - text: "Le zoom rend le chiffre lisible et cache son intitulé"
    rarity: common
  - text: "Le partageur fait défiler le document plus vite qu’on peut le lire"
    rarity: common
  - text: "La vidéo se lance avec le son désactivé pour les participants"
    rarity: common
  - text: "Quelqu’un prend le partage d’écran sans prévenir la personne qui présente"
    rarity: common
  - text: "Une mise à jour logicielle prend la place de la démonstration"
    rarity: common
  - text: "La barre des participants cache précisément la ligne discutée"
    rarity: common
  - text: "L’écran reste sur la première slide pendant le commentaire des suivantes"
    rarity: common
  - text: "Le présentateur lit ses notes privées sur l’écran partagé"
    rarity: common

  # Salle et réunion hybride
  - text: "La salle est réservée par deux équipes, chacune montre son calendrier"
    rarity: common
  - text: "Le câble de présentation n’atteint pas la place du présentateur"
    rarity: common
  - text: "On cherche un adaptateur plus longtemps qu’on ne présente le sujet"
    rarity: common
  - text: "La salle de quatre accueille dix personnes et leurs ordinateurs"
    rarity: common
  - text: "Le tableau est rempli de notes que personne n’ose effacer"
    rarity: common
  - text: "Le seul marqueur écrit juste assez pour faire le premier mot"
    rarity: common
  - text: "La réunion d’à côté passe demander le silence"
    rarity: common
  - text: "La personne près du micro chuchote la réponse à son voisin"
    rarity: common
  - text: "Les distants regardent un tableau blanc hors champ"
    rarity: common
  - text: "Une main virtuelle reste levée pendant que la salle change de sujet"
    rarity: common
  - text: "On vote à main levée sans compter les distants"
    rarity: common
  - text: "Le compte rendu est « sur le paperboard », invisible en visio"
    rarity: common
  - text: "La caméra filme les chaises vides au lieu des participants"
    rarity: common
  - text: "Les décisions se prennent à voix basse dans un coin de la salle"
    rarity: common
  - text: "Quelqu’un présente une feuille A4 à la webcam pour toute la salle"
    rarity: common

  # Slides et documents
  - text: "Le présentateur lit ses slides mot pour mot"
    rarity: common
  - text: "Le sommaire tient sur trois slides"
    rarity: common
  - text: "Le diaporama contient encore « insérer le titre ici »"
    rarity: common
  - text: "Le titre annonce une décision, la slide contient seulement des questions"
    rarity: common
  - text: "La slide « synthèse » contient un paragraphe de vingt lignes"
    rarity: common
  - text: "« Je passe vite » mais chaque point de la slide est quand même lu"
    rarity: common
  - text: "La date de la présentation est celle du comité précédent"
    rarity: common
  - text: "Les slides gardent les commentaires « à vérifier »"
    rarity: common
  - text: "Le graphique a des couleurs mais aucune légende"
    rarity: common
  - text: "Une animation fait apparaître chaque lettre du titre séparément"
    rarity: common
  - text: "Le screenshot montre un tableau illisible même en plein écran"
    rarity: common
  - text: "La conclusion annonce un chiffre différent de la slide précédente"
    rarity: common
  - text: "Le fichier partagé s’appelle « final_v2_final_vraiment »"
    rarity: common
  - text: "La slide « Questions ? » est passée avant qu’on puisse en poser une"
    rarity: common
  - text: "Le présentateur s’excuse de l’illisibilité puis continue à pointer des chiffres"
    rarity: common

  # Écoute et prise de parole
  - text: "La question posée a sa réponse écrite sur la slide affichée"
    rarity: common
  - text: "Quelqu’un dit « je complète » et répète la même chose"
    rarity: common
  - text: "La personne qui réclame de la concision monopolise la parole"
    rarity: common
  - text: "Une interruption commence par « je ne veux pas te couper »"
    rarity: common
  - text: "Quelqu’un finit les phrases des autres avec les mauvais mots"
    rarity: common
  - text: "On répond à une question différente pour éviter celle qui est posée"
    rarity: common
  - text: "Le « petit complément » est plus long que la présentation"
    rarity: common
  - text: "Quelqu’un dit « exactement » avant de soutenir le contraire"
    rarity: common
  - text: "Le résumé change complètement le sens de l’intervention"
    rarity: common
  - text: "Une idée ignorée devient excellente quand le chef la répète"
    rarity: common
  - text: "La personne interrompue doit lever la main pour finir sa phrase"
    rarity: common
  - text: "Quelqu’un demande ton avis puis répond à ta place"
    rarity: common
  - text: "On pose une question à la personne qui vient de quitter la réunion"
    rarity: common
  - text: "Une réponse commence par « oui » et se termine par « donc non »"
    rarity: common
  - text: "La personne qui n’écoutait pas demande « c’était une question pour moi ? »"
    rarity: common

  # Jargon et flou
  - text: "« On s’aligne » mais personne ne précise sur quoi"
    rarity: common
  - text: "Une tâche devient un « chantier » dès qu’on demande qui la fera"
    rarity: common
  - text: "« C’est stratégique » remplace l’explication du besoin"
    rarity: common
  - text: "Le même mot désigne deux choses différentes selon la personne qui parle"
    rarity: common
  - text: "Un acronyme est expliqué avec deux autres acronymes"
    rarity: common
  - text: "« On manque de visibilité » alors que le planning est affiché"
    rarity: common
  - text: "« C’est un quick win » à propos d’un travail de trois mois"
    rarity: common
  - text: "« Il faut être agile » sert à justifier un changement de dernière minute"
    rarity: common
  - text: "« C’est presque fini » n’inclut pas ce qui reste à faire"
    rarity: common
  - text: "« Il faut challenger » sans qu’aucune objection précise ne suive"
    rarity: common
  - text: "« On prend de la hauteur » dès qu’une question concrète arrive"
    rarity: common
  - text: "« On capitalise » signifie copier le document du projet précédent"
    rarity: common
  - text: "« On optimise les ressources » signifie donner le travail aux mêmes personnes"
    rarity: common
  - text: "Quelqu’un corrige le mot anglais mais pas le problème décrit"
    rarity: common
  - text: "« C’est simple » est prononcé par la personne qui ne fera pas le travail"
    rarity: common

  # Décisions et priorités
  - text: "Tout est classé en priorité un"
    rarity: common
  - text: "On vote après que le décideur a annoncé son choix"
    rarity: common
  - text: "Le silence est enregistré comme un accord unanime"
    rarity: common
  - text: "Le sujet déjà validé redevient « à arbitrer »"
    rarity: common
  - text: "La décision dépend d’une personne absente et personne ne l’appelle"
    rarity: common
  - text: "L’équipe valide deux options qui s’excluent mutuellement"
    rarity: common
  - text: "« On garde les deux » conclut la réunion censée choisir"
    rarity: common
  - text: "On tranche sans demander l’avis de l’équipe qui exécutera"
    rarity: common
  - text: "La date est décidée avant qu’on ait défini le travail"
    rarity: common
  - text: "On rajoute une priorité sans en retirer aucune"
    rarity: common
  - text: "L’option retenue est celle du dernier à avoir parlé"
    rarity: common
  - text: "L’accord est donné « sous réserve » sans préciser la réserve"
    rarity: common
  - text: "On reporte la décision pour refaire exactement la même réunion"
    rarity: common
  - text: "Le décideur demande que quelqu’un d’autre valide sa décision"
    rarity: common
  - text: "Quelqu’un demande une troisième option après avoir exigé un choix binaire"
    rarity: common

  # Actions et responsabilités
  - text: "Une action est attribuée à « l’équipe » sans nommer personne"
    rarity: common
  - text: "La date de livraison est « dès que possible »"
    rarity: common
  - text: "« Tu peux prendre le sujet ? » tient lieu de brief"
    rarity: common
  - text: "On attribue une tâche à quelqu’un qui vient d’annoncer ses congés"
    rarity: common
  - text: "Le responsable découvre son nom en lisant la colonne des actions"
    rarity: common
  - text: "La personne chargée du compte rendu est désignée à la fin"
    rarity: common
  - text: "Deux responsables se désignent mutuellement à la question « qui s’en charge ? »"
    rarity: common
  - text: "« On s’en occupe » et personne ne l’inscrit dans les actions"
    rarity: common
  - text: "La tâche bloquée consiste à demander qui peut la débloquer"
    rarity: common
  - text: "On assigne une échéance déjà passée"
    rarity: common
  - text: "La même action est recopiée du compte rendu précédent sans commentaire"
    rarity: common
  - text: "Le suivi est confié à quelqu’un qui n’a pas accès au dossier"
    rarity: common
  - text: "« Tu nous relances » devient ta nouvelle responsabilité"
    rarity: common
  - text: "Le volontaire hérite aussi de toutes les tâches voisines"
    rarity: common
  - text: "La tâche consiste à ressaisir les informations du document qu’on vient de partager"
    rarity: common

  # Management et hiérarchie
  - text: "Le manager te passe la parole sur un sujet dont il ne t’a jamais parlé"
    rarity: common
  - text: "Le chef découvre le projet sur lequel il doit arbitrer"
    rarity: common
  - text: "Une estimation devient un engagement dès que le directeur la répète"
    rarity: common
  - text: "Le manager demande de l’autonomie puis valide chaque mot"
    rarity: common
  - text: "Quelqu’un attend de connaître l’avis du chef avant de donner le sien"
    rarity: common
  - text: "Le chef demande « des idées neuves » puis refuse tout changement"
    rarity: common
  - text: "Une question technique est transférée au plus haut gradé"
    rarity: common
  - text: "Le manager dit « notre idée » en présentant le travail d’une seule personne"
    rarity: common
  - text: "La réponse devient plus polie dès qu’un directeur rejoint la réunion"
    rarity: common
  - text: "On demande un avis franc puis on explique pourquoi il est inapproprié"
    rarity: common
  - text: "Le chef nomme un volontaire avant d’ouvrir l’appel à volontaires"
    rarity: common
  - text: "Quelqu’un transforme une préférence du manager en règle officielle"
    rarity: common
  - text: "Une bonne nouvelle est présentée par le chef, la mauvaise par son équipe"
    rarity: common
  - text: "Le manager demande un statut déjà envoyé le matin même"
    rarity: common
  - text: "La validation dépend du titre de la personne, pas de son argument"
    rarity: common

  # Chat et attention dispersée
  - text: "Une réponse destinée au chat est lue à voix haute sans son contexte"
    rarity: common
  - text: "Quelqu’un écrit « je suis en réunion » dans le chat de cette réunion"
    rarity: common
  - text: "Une question du chat est reposée à l’oral sans attendre la réponse"
    rarity: common
  - text: "Le fil de blagues avance plus vite que l’ordre du jour"
    rarity: common
  - text: "Quelqu’un rit à un message privé pendant l’annonce d’un problème"
    rarity: common
  - text: "Le présentateur reçoit « tu peux avancer ? » du collègue assis à côté"
    rarity: common
  - text: "Le lien demandé est envoyé uniquement à une personne en privé"
    rarity: common
  - text: "Une réaction pouce levé est interprétée comme une prise en charge"
    rarity: common
  - text: "La question urgente se perd sous les messages « bonjour »"
    rarity: common
  - text: "Le sondage se ferme avant que les personnes en salle aient reçu le lien"
    rarity: common
  - text: "On te demande de répondre au chat pendant que tu présentes"
    rarity: common
  - text: "Le même fichier est envoyé plusieurs fois avec « le bon cette fois »"
    rarity: common
  - text: "Quelqu’un annonce dans le chat son départ après qu’on lui a posé une question"
    rarity: common
  - text: "Le chat contient une objection que le compte rendu appelle un accord"
    rarity: common
  - text: "L’animateur demande les questions puis désactive le chat"
    rarity: common

  # Chiffres et indicateurs
  - text: "Le pourcentage est affiché sans dire sur combien de personnes"
    rarity: common
  - text: "Le chiffre précis devient « à peu près » dès qu’on demande sa source"
    rarity: common
  - text: "Deux graphiques du même indicateur ne donnent pas le même résultat"
    rarity: common
  - text: "Le tableau est tout vert, mais le projet est annoncé en retard"
    rarity: common
  - text: "On compare un mois complet avec trois jours du mois en cours"
    rarity: common
  - text: "L’axe du graphique démarre juste sous la valeur qu’on veut impressionner"
    rarity: common
  - text: "Une moyenne est utilisée pour éviter de montrer les écarts"
    rarity: common
  - text: "Le chiffre vient de « la dernière fois », sans date"
    rarity: common
  - text: "Le total ne correspond pas aux lignes affichées"
    rarity: common
  - text: "Le tableau mélange euros et milliers d’euros"
    rarity: common
  - text: "Quelqu’un cite un pourcentage avec deux décimales puis dit « c’est au doigt mouillé »"
    rarity: common
  - text: "Le résultat est déclaré bon parce que la cible a été baissée"
    rarity: common
  - text: "Une estimation de l’équipe devient une donnée client dans la slide suivante"
    rarity: common
  - text: "On retire du graphique la période qui contredit la conclusion"
    rarity: common
  - text: "Personne ne sait ce que mesure l’indicateur qu’on doit améliorer"
    rarity: common

  # Charge et planning
  - text: "Une nouvelle demande arrive avec « ça prend cinq minutes »"
    rarity: common
  - text: "Le planning suppose que personne ne sera jamais absent"
    rarity: common
  - text: "Les deux jours du week-end sont comptés comme disponibles dans le planning"
    rarity: common
  - text: "Le délai reste le même après qu’on a doublé le périmètre"
    rarity: common
  - text: "On propose une livraison vendredi soir et un retour lundi matin"
    rarity: common
  - text: "Une dépendance externe est planifiée comme si elle répondait instantanément"
    rarity: common
  - text: "Le planning n’a aucune ligne pour les tests"
    rarity: common
  - text: "Le retard connu depuis un mois est présenté comme une surprise"
    rarity: common
  - text: "Une marge de sécurité est supprimée parce qu’elle « ne sert à rien »"
    rarity: common
  - text: "Le planning est validé sans demander la disponibilité des personnes"
    rarity: common
  - text: "On demande une date ferme pour un besoin encore flou"
    rarity: common
  - text: "La tâche facile a trois semaines, la tâche complexe une après-midi"
    rarity: common
  - text: "La revue est prévue après la date de livraison"
    rarity: common
  - text: "Les disponibilités sont calculées en oubliant les réunions"
    rarity: common
  - text: "Une échéance « non négociable » change dès que le chef est indisponible"
    rarity: common

  # Besoin et périmètre
  - text: "Le brief commence par une solution et personne ne connaît le problème"
    rarity: common
  - text: "« Comme chez le concurrent » remplace la description du besoin"
    rarity: common
  - text: "Le besoin utilisateur est défendu sans qu’aucun utilisateur ait été consulté"
    rarity: common
  - text: "On ajoute une option « au cas où » sans pouvoir nommer un usage"
    rarity: common
  - text: "Une demande change de nom pour être présentée comme hors périmètre"
    rarity: common
  - text: "Le cas exceptionnel prend toute la place dans la discussion"
    rarity: common
  - text: "« Tout le monde le demande » désigne une seule personne"
    rarity: common
  - text: "On débat d’une couleur alors que le parcours ne fonctionne pas"
    rarity: common
  - text: "Le livrable est décrit avec « tu vois l’idée »"
    rarity: common
  - text: "Le mot « simple » apparaît plus souvent que les critères d’acceptation"
    rarity: common
  - text: "Une fonctionnalité supprimée revient déguisée en « petite amélioration »"
    rarity: common
  - text: "Personne ne sait distinguer une contrainte d’une préférence"
    rarity: common
  - text: "Le problème est confié à un outil avant d’avoir été défini"
    rarity: common
  - text: "Le budget est connu de tous sauf de la personne qui doit proposer"
    rarity: common
  - text: "« Ça doit être intuitif » est la seule réponse à une demande de précision"
    rarity: common

  # Clients et promesses
  - text: "Le commercial annonce une date que l’équipe découvre en direct"
    rarity: common
  - text: "Une option payante est présentée au client comme déjà incluse"
    rarity: common
  - text: "Le présentateur déclare inutile le seul parcours demandé par le client"
    rarity: common
  - text: "Quelqu’un dit « aucun problème » avant de regarder l’équipe technique"
    rarity: common
  - text: "Le client change la demande puis parle de « petite correction »"
    rarity: common
  - text: "On promet une réponse le jour même à la personne qui part en congés"
    rarity: common
  - text: "L’interlocuteur client demande une décision qu’il ne peut lui-même valider"
    rarity: common
  - text: "Une réunion de cadrage devient une négociation du devis"
    rarity: common
  - text: "Une maquette est présentée comme un produit presque terminé"
    rarity: common
  - text: "Le client dit « carte blanche » puis décrit exactement ce qu’il veut"
    rarity: common
  - text: "Quelqu’un appelle le client par le nom d’un autre client"
    rarity: common
  - text: "Une demande contradictoire est résumée par « vous avez bien compris »"
    rarity: common
  - text: "L’équipe utilise un acronyme interne pendant toute la présentation client"
    rarity: common
  - text: "Le client découvre une limite annoncée uniquement en note de bas de page"
    rarity: common
  - text: "On promet une personnalisation avant de vérifier si elle est possible"
    rarity: common

  # Démonstrations
  - text: "La démo commence par « normalement ça marche »"
    rarity: common
  - text: "Le compte de démonstration n’a pas les droits nécessaires"
    rarity: common
